name: Astra STEP 1 + STEP 2 validation
on:
  push:
    branches: [main, 'feature/step2-*', 'feature/step3-*', 'integration/astra-commercial-core']
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Install Korean fonts for visual comparison on CI only
        run: |
          if ! fc-list :lang=ko family | grep -q .; then
            sudo apt-get update -qq
            sudo apt-get install -y fonts-noto-cjk
            fc-cache -f
          fi
          fc-list :lang=ko family | head -n 2
      - name: Chrome print and persistence smoke
        run: |
          CHROME_BIN=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          echo "Chrome: ${CHROME_BIN:-unavailable}"
          echo "pdfinfo: $(command -v pdfinfo || true)"
          echo "pdftotext: $(command -v pdftotext || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "::error::Chrome unavailable; required browser/PDF regression tests cannot run"
            exit 1
          fi
          if ! command -v pdfinfo >/dev/null || ! command -v pdftotext >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y poppler-utils
          fi
          npm run dev -- --port 4173 >/tmp/astra-vite.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then break; fi
            sleep 0.5
          done
          CHROME_PATH="$CHROME_BIN" node tests/browser-smoke.mjs
          CHROME_PATH="$CHROME_BIN" node tests/step2-browser.mjs
          CHROME_PATH="$CHROME_BIN" node tests/step2-multitab.mjs
          CHROME_PATH="$CHROME_BIN" node tests/step2-cold-migration.mjs
          CHROME_PATH="$CHROME_BIN" STEP2_INJECT_MIGRATION_ABORT=1 node tests/step2-cold-migration.mjs
          CHROME_PATH="$CHROME_BIN" node tests/step2-cross-profile.mjs
          M02_SCREENSHOT_OUT="$RUNNER_TEMP/astra-m02-studio.png" CHROME_PATH="$CHROME_BIN" node tests/step3-browser.mjs
          CHROME_PATH="$CHROME_BIN" node tests/step3-password-browser.mjs
          CHROME_PATH="$CHROME_BIN" node tests/step3-consent-browser.mjs
      - name: Upload actual M02 studio screenshot (synthetic-only CI content)
        uses: actions/upload-artifact@v4
        with:
          name: astra-m02-studio-chrome-synthetic
          path: ${{ runner.temp }}/astra-m02-studio.png
          if-no-files-found: error
          retention-days: 7
  # A new GitHub-hosted VM prevents leftover Chrome helpers and long-running
  # profile cleanup from exhausting Edge browser resources.
  edge-validation:
    name: Microsoft Edge A4 PDF and IndexedDB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Microsoft Edge A4 print and IndexedDB smoke
        run: |
          set -euo pipefail
          EDGE_BIN=$(command -v microsoft-edge || command -v microsoft-edge-stable || command -v microsoft-edge-beta || true)
          if [ -z "$EDGE_BIN" ]; then
            echo "::error::Microsoft Edge unavailable; required Edge PDF and storage checks cannot run"
            exit 1
          fi
          echo "Microsoft Edge executable: $EDGE_BIN"
          "$EDGE_BIN" --version
          if ! command -v pdfinfo >/dev/null || ! command -v pdftotext >/dev/null || ! command -v pdfimages >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y poppler-utils
          fi
          npm run dev -- --port 4173 >/tmp/astra-vite-edge.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then break; fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:4173 >/dev/null
          echo "Running STEP 1 A4 print and STEP 2 IndexedDB, images, JSON and long-caption PDF regressions with actual Edge"
          CHROME_PATH="$EDGE_BIN" node tests/browser-smoke.mjs
          CHROME_PATH="$EDGE_BIN" node tests/step2-browser.mjs
          CHROME_PATH="$EDGE_BIN" node tests/step3-browser.mjs
          CHROME_PATH="$EDGE_BIN" node tests/step3-password-browser.mjs
          CHROME_PATH="$EDGE_BIN" node tests/step3-consent-browser.mjs
          echo "PASS EDGE: STEP1 A4 PDF and STEP2 print, persistence, images, import/export and pagination checks"

