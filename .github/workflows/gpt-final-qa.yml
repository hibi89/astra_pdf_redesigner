name: ASTRA GPT G001 OCR and G002 content-preservation QA
on:
  push:
    branches:
      - 'gpt/astra-final-qa-ocr-20261115'
    paths:
      - 'tools/gpt-final-qa-*'
      - 'tests/gpt-final-qa-*'
      - 'docs/evidence/astra/G001/**'
      - '.github/workflows/gpt-final-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g001-provenance-and-release-hold:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: G001/G002 independent fail-closed regressions
        run: |
          node --check tools/gpt-final-qa-p119-gate.cjs
          node --check tools/gpt-final-qa-text-fidelity.cjs
          node --test tests/gpt-final-qa-p119-gate.test.cjs tests/gpt-final-qa-text-fidelity.test.cjs tests/ocr-supply-chain-preflight.test.cjs tests/ocr-release-hold-gate.test.cjs
      - name: Historical unapproved suppliers must be classified BLOCKED
        run: |
          node - <<'NODE'
          const {auditFile} = require('./tools/gpt-final-qa-p119-gate.cjs');
          const r = auditFile('docs/evidence/astra/G001/SUPPLIER_EVIDENCE_MATRIX.json');
          if (r.overall !== 'BLOCKED' || r.scoreDelta !== 0 || r.ocrManifest !== null ||
              r.release !== 'RELEASE HOLD' || r.candidates.length !== 3 ||
              r.candidates.some(c => c.verdict !== 'BLOCKED' || c.supplierApproved ||
                c.productOcrEnabled || c.installerExecutionPermitted)) {
            throw Error('G001_FAIL_CLOSED_SUPPLIER_ASSERTION_FAILED');
          }
          console.log('PASS G001 supplier provenance remains BLOCKED; no OCR activation or score change');
          NODE
      - name: Existing product OCR release gate stays active
        run: node desktop/ocr-release-hold-gate.cjs
