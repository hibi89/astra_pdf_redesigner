name: Step 1 validation
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Chrome print and persistence smoke
        run: |
          CHROME_BIN=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          echo "Chrome: ${CHROME_BIN:-unavailable}"
          echo "pdfinfo: $(command -v pdfinfo || true)"
          echo "pdftotext: $(command -v pdftotext || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "::warning::Chrome unavailable; browser checks not executed"
            exit 0
          fi
          if ! command -v pdfinfo >/dev/null || ! command -v pdftotext >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y poppler-utils
          fi
          npm run dev -- --port 4173 >/tmp/astra-vite.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then break; fi
            sleep 0.5
          done
          CHROME_PATH="$CHROME_BIN" node tests/browser-smoke.mjs
