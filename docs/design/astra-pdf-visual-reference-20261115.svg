<svg xmlns="http://www.w3.org/2000/svg" width="724" height="746" viewBox="0 0 724 746" role="img" aria-labelledby="title desc">
<title id="title">Astra PDF Redesigner visual target — conceptual redraw, 2026-11-15</title>
<desc id="desc">Dark purple promotional hero with five capability cards and a before/after document transformation. Visual guidance, not actual UI or tested feature evidence.</desc>
<defs>
 <linearGradient id="bg" x1="0" x2=".9" y1="0" y2="1"><stop stop-color="#1c0c37"/><stop offset=".53" stop-color="#140c29"/><stop offset="1" stop-color="#542290"/></linearGradient>
 <linearGradient id="purple" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#a85afa"/><stop offset="1" stop-color="#6223d9"/></linearGradient>
 <linearGradient id="after" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#eee9ff"/></linearGradient>
 <linearGradient id="glass" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#71568c" stop-opacity=".55"/><stop offset="1" stop-color="#3c2756" stop-opacity=".62"/></linearGradient>
 <filter id="sh"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#020013" flood-opacity=".45"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="11"/></filter>
</defs>
