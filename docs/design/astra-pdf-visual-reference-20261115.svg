<g font-family="Arial,sans-serif" fill="#202020">
<text x="66" y="311" font-size="19" font-weight="800">2025년 사업 운영 보고서</text>
<path d="M65 325 H293" stroke="#ddd"/>
<text x="67" y="359" font-size="15" font-weight="700">1. 개요</text>
<text x="71" y="383" font-size="11">본 보고서는 2025년 사업 운영 성과를 정리한 것으로,</text>
<text x="71" y="401" font-size="11">주요 성과와 향후 계획을 포함합니다.</text>
<text x="67" y="439" font-size="15" font-weight="700">2. 주요 성과</text>
<text x="72" y="462" font-size="12">- 매출: 전년 대비 18% 증가</text>
<text x="72" y="481" font-size="12">- 신규 고객: 1,240명</text>
<text x="72" y="500" font-size="12">- 운영 효율: 15% 개선</text>
<text x="67" y="543" font-size="15" font-weight="700">3. 향후 계획</text>
<text x="72" y="565" font-size="12">- 서비스 고도화</text>
<text x="72" y="584" font-size="12">- 마케팅 확대</text>
<text x="72" y="603" font-size="12">- 운영 자동화 추진</text>
</g>
