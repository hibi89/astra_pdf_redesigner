name: C010 unsigned Windows package candidate audit
on:
  push:
    branches: ['codex/astra-final-ai-sku-20261115']
    paths:
      - '.github/workflows/c010-package-audit.yml'
      - 'desktop/**'
      - 'electron-builder.yml'
      - 'src/**'
      - 'package*.json'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned-package-audit:
    name: Windows NSIS candidate, SBOM, and release-hold audit
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked application dependencies
        run: npm install --no-audit --no-fund
      - name: Run full regression and release-hold verification
        run: |
          npm test
          npm run build
          npm run desktop:verify
      - name: Produce local-only SBOM and report license metadata coverage
        shell: pwsh
        run: |
          $sbomPath = Join-Path $env:RUNNER_TEMP 'astra-c010-sbom.json'
          npm sbom --sbom-format cyclonedx --omit=dev | Out-File -LiteralPath $sbomPath -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'npm SBOM generation failed.' }
          $summary = node -e "const fs=require('node:fs'); const s=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); const c=s.components||[]; const missing=c.filter(x=>!Array.isArray(x.licenses)||x.licenses.length===0); console.log(JSON.stringify({format:s.bomFormat,components:c.length,licenseMetadataMissing:missing.length}));" $sbomPath
          if ($LASTEXITCODE -ne 0) { throw 'SBOM JSON validation failed.' }
          "SBOM $summary" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Write-Output $summary
      - name: Build unsigned NSIS candidate without publishing
        shell: pwsh
        run: |
          npx electron-builder --win nsis --x64 --dir --publish never
          if ($LASTEXITCODE -ne 0) { throw 'Unpacked Windows application build failed.' }
          $asarPath = Join-Path $env:GITHUB_WORKSPACE 'release/win-unpacked/resources/app.asar'
          $asarCli = Join-Path $env:GITHUB_WORKSPACE 'node_modules/.bin/asar.cmd'
          if (-not (Test-Path -LiteralPath $asarPath -PathType Leaf)) { throw 'Built app.asar is missing.' }
          if (-not (Test-Path -LiteralPath $asarCli -PathType Leaf)) { throw 'Electron ASAR listing tool is missing.' }
          $asarEntries = @(& $asarCli list $asarPath)
          if ($LASTEXITCODE -ne 0) { throw 'Could not enumerate built app.asar.' }
          $testOnlyEntries = @($asarEntries | Where-Object { $_ -match '(?i)p124-electron-qwen3-acceptance|tests[/\\]fixtures[/\\]p124-electron-qwen3' })
          if ($testOnlyEntries.Count -ne 0) { throw "Test-only P124 content leaked into app.asar: $($testOnlyEntries -join ', ')" }
          Write-Output "PASS app.asar excludes P124 test harness; enumerated entries=$($asarEntries.Count)"
          $extractPath = Join-Path $env:RUNNER_TEMP 'astra-c010-app-asar-content'
          if (Test-Path -LiteralPath $extractPath) { throw 'Package audit extraction path already exists.' }
          & $asarCli extract $asarPath $extractPath
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract the unsigned app.asar into the isolated runner temp directory.' }
          node tests/c010-package-content-audit.cjs $extractPath
          if ($LASTEXITCODE -ne 0) { throw 'Unsigned app.asar content audit found a blocked path, secret signature, PII pattern, or unscanned item.' }
          $workspacePath = [System.IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $workspacePrefix = $workspacePath.TrimEnd([System.IO.Path]::DirectorySeparatorChar, [System.IO.Path]::AltDirectorySeparatorChar) + [System.IO.Path]::DirectorySeparatorChar
          $appDir = [System.IO.Path]::GetFullPath((Join-Path $workspacePath 'release/win-unpacked'))
          if (-not $appDir.StartsWith($workspacePrefix, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw 'Refusing to clear a generated app directory outside the GitHub workspace.'
          }
          if (-not (Test-Path -LiteralPath $appDir -PathType Container)) { throw 'First unpacked application directory is missing.' }

          function Normalize-AstraPackageTree([string]$root) {
            $resolved = [System.IO.Path]::GetFullPath($root)
            if (-not (Test-Path -LiteralPath $resolved -PathType Container)) { throw "Package tree is missing: $resolved" }
            $fixedUtc = [System.DateTime]::new(2020, 1, 1, 0, 0, 0, [System.DateTimeKind]::Utc)
            $items = @(Get-ChildItem -LiteralPath $resolved -Force -Recurse | Sort-Object { $_.FullName.Length } -Descending)
            foreach ($item in $items) {
              $item.CreationTimeUtc = $fixedUtc
              $item.LastWriteTimeUtc = $fixedUtc
              $item.LastAccessTimeUtc = $fixedUtc
            }
            $rootItem = Get-Item -LiteralPath $resolved -Force
            $rootItem.CreationTimeUtc = $fixedUtc
            $rootItem.LastWriteTimeUtc = $fixedUtc
            $rootItem.LastAccessTimeUtc = $fixedUtc
          }

          function Copy-AstraPackageTreeDeterministic([string]$source, [string]$destination) {
            $sourcePath = [System.IO.Path]::GetFullPath($source)
            $destinationPath = [System.IO.Path]::GetFullPath($destination)
            if (-not (Test-Path -LiteralPath $sourcePath -PathType Container)) { throw "Package source is missing: $sourcePath" }
            if (Test-Path -LiteralPath $destinationPath) { throw "Deterministic package destination already exists: $destinationPath" }
            New-Item -ItemType Directory -Path $destinationPath | Out-Null
            $items = @(Get-ChildItem -LiteralPath $sourcePath -Force -Recurse)
            if (@($items | Where-Object { $_.Attributes -band [System.IO.FileAttributes]::ReparsePoint }).Count -ne 0) {
              throw 'Deterministic staging does not accept reparse points.'
            }
            $directories = @($items | Where-Object { $_.PSIsContainer } | Sort-Object { $_.FullName.Substring($sourcePath.Length) } -CaseSensitive)
            foreach ($item in $directories) {
              $relative = $item.FullName.Substring($sourcePath.Length).TrimStart([char[]]@([System.IO.Path]::DirectorySeparatorChar, [System.IO.Path]::AltDirectorySeparatorChar))
              New-Item -ItemType Directory -Path (Join-Path $destinationPath $relative) -Force | Out-Null
            }
            $files = @($items | Where-Object { -not $_.PSIsContainer } | Sort-Object { $_.FullName.Substring($sourcePath.Length) } -CaseSensitive)
            foreach ($item in $files) {
              $relative = $item.FullName.Substring($sourcePath.Length).TrimStart([char[]]@([System.IO.Path]::DirectorySeparatorChar, [System.IO.Path]::AltDirectorySeparatorChar))
              Copy-Item -LiteralPath $item.FullName -Destination (Join-Path $destinationPath $relative)
            }
          }

          $firstAppPath = Join-Path $env:RUNNER_TEMP 'astra-c010-prepackaged-first'
          $secondAppPath = Join-Path $env:RUNNER_TEMP 'astra-c010-prepackaged-second'
          if ((Test-Path -LiteralPath $firstAppPath) -or (Test-Path -LiteralPath $secondAppPath)) {
            throw 'C010 prepackaged output path already exists.'
          }
          Copy-Item -LiteralPath $appDir -Destination $firstAppPath -Recurse
          Normalize-AstraPackageTree $firstAppPath
          $treeSnapshot = Join-Path $env:RUNNER_TEMP 'astra-c010-prepackaged-first.json'
          node tests/c010-package-tree-summary.cjs capture $firstAppPath $treeSnapshot
          if ($LASTEXITCODE -ne 0) { throw 'Could not capture first normalized package tree.' }

          Remove-Item -LiteralPath $appDir -Recurse -Force
          npx electron-builder --win nsis --x64 --dir --publish never
          if ($LASTEXITCODE -ne 0) { throw 'Second unpacked Windows application build failed.' }
          if (-not (Test-Path -LiteralPath $appDir -PathType Container)) { throw 'Second unpacked application directory is missing.' }
          Copy-Item -LiteralPath $appDir -Destination $secondAppPath -Recurse
          Normalize-AstraPackageTree $secondAppPath

          $treeComparisonOutput = node tests/c010-package-tree-summary.cjs compare $secondAppPath $treeSnapshot
          if ($LASTEXITCODE -ne 0) { throw 'Could not compare independent package trees.' }
          $treeComparison = $treeComparisonOutput | ConvertFrom-Json
          Write-Output $treeComparisonOutput
          if (-not $treeComparison.samePayloadTree -or $treeComparison.counts.metadataChangedEntries -ne 0) {
            throw 'Independent source builds did not produce matching canonical package trees.'
          }

          $firstAsarPath = Join-Path $firstAppPath 'resources/app.asar'
          $secondAsarPath = Join-Path $secondAppPath 'resources/app.asar'
          $firstAsarHash = (Get-FileHash -LiteralPath $firstAsarPath -Algorithm SHA256).Hash
          $secondAsarHash = (Get-FileHash -LiteralPath $secondAsarPath -Algorithm SHA256).Hash
          if ($firstAsarHash -ne $secondAsarHash) { throw 'Independent source build app.asar hashes differ.' }

          $canonicalAppPath = Join-Path $env:RUNNER_TEMP 'astra-c010-canonical-prepackaged'
          Copy-Item -LiteralPath $firstAppPath -Destination $canonicalAppPath -Recurse
          Normalize-AstraPackageTree $canonicalAppPath

          $firstPackageAppPath = Join-Path $env:RUNNER_TEMP 'astra-c010-first-deterministic-tree'
          $thirdAppPath = Join-Path $env:RUNNER_TEMP 'astra-c010-repeat-canonical'
          Copy-AstraPackageTreeDeterministic $firstAppPath $firstPackageAppPath
          Copy-AstraPackageTreeDeterministic $canonicalAppPath $thirdAppPath
          Normalize-AstraPackageTree $firstPackageAppPath
          Normalize-AstraPackageTree $thirdAppPath
          $firstStageCompare = node tests/c010-package-tree-summary.cjs compare $firstPackageAppPath $treeSnapshot
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify the first deterministic package tree.' }
          $firstStage = $firstStageCompare | ConvertFrom-Json
          Write-Output $firstStageCompare
          $thirdTreeOutput = node tests/c010-package-tree-summary.cjs compare $thirdAppPath $treeSnapshot
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify the repeat deterministic package tree.' }
          $thirdTree = $thirdTreeOutput | ConvertFrom-Json
          Write-Output $thirdTreeOutput
          if (-not $firstStage.samePayloadTree -or $firstStage.counts.metadataChangedEntries -ne 0 -or
            -not $thirdTree.samePayloadTree -or $thirdTree.counts.metadataChangedEntries -ne 0) {
            throw 'Deterministic staging changed package content or metadata.'
          }
          $firstElevatePath = Join-Path $firstPackageAppPath 'resources/elevate.exe'
          $firstElevateBeforeHash = (Get-FileHash -LiteralPath $firstElevatePath -Algorithm SHA256).Hash
          $firstElevateBeforeSignature = (Get-AuthenticodeSignature -LiteralPath $firstElevatePath).Status

          npx electron-builder --win nsis --x64 --prepackaged $firstPackageAppPath --publish never
          if ($LASTEXITCODE -ne 0) { throw 'First prepackaged unsigned NSIS build failed.' }
          $firstElevateAfterHash = (Get-FileHash -LiteralPath $firstElevatePath -Algorithm SHA256).Hash
          $firstElevateAfterSignature = (Get-AuthenticodeSignature -LiteralPath $firstElevatePath).Status
          Write-Output "C010 elevate first: before=$firstElevateBeforeHash/$firstElevateBeforeSignature after=$firstElevateAfterHash/$firstElevateAfterSignature"
          $setups = @(Get-ChildItem -LiteralPath 'release' -Filter 'ASTRA-PDF-Redesigner-Setup-*-x64.exe' -File)
          if ($setups.Count -ne 1) { throw "Expected one first unsigned candidate, found $($setups.Count)." }
          $firstSignature = Get-AuthenticodeSignature -LiteralPath $setups[0].FullName
          if ($firstSignature.Status -ne 'NotSigned') { throw "Expected an unsigned first candidate, got $($firstSignature.Status)." }
          $firstCandidatePath = Join-Path $env:RUNNER_TEMP 'astra-c010-first-unsigned-candidate.exe'
          Copy-Item -LiteralPath $setups[0].FullName -Destination $firstCandidatePath
          $firstCandidateHash = (Get-FileHash -LiteralPath $firstCandidatePath -Algorithm SHA256).Hash
          $firstCandidateBytes = (Get-Item -LiteralPath $firstCandidatePath).Length
          Write-Output "C010 reproducibility build 1: installer=$firstCandidateHash app.asar=$firstAsarHash"
          Remove-Item -LiteralPath $setups[0].FullName -Force

          $secondElevatePath = Join-Path $secondAppPath 'resources/elevate.exe'
          $secondElevateBeforeHash = (Get-FileHash -LiteralPath $secondElevatePath -Algorithm SHA256).Hash
          $secondElevateBeforeSignature = (Get-AuthenticodeSignature -LiteralPath $secondElevatePath).Status
          npx electron-builder --win nsis --x64 --prepackaged $secondAppPath --publish never
          $secondBuildExitCode = $LASTEXITCODE
          $secondElevateAfterHash = (Get-FileHash -LiteralPath $secondElevatePath -Algorithm SHA256).Hash
          $secondElevateAfterSignature = (Get-AuthenticodeSignature -LiteralPath $secondElevatePath).Status
          Write-Output "C010 elevate independent tree: before=$secondElevateBeforeHash/$secondElevateBeforeSignature after=$secondElevateAfterHash/$secondElevateAfterSignature"
          $secondSetups = @()
          $secondHash = 'unavailable'
          $secondBytes = 0
          $secondSignatureStatus = 'unavailable'
          if ($secondBuildExitCode -eq 0) {
            $secondSetups = @(Get-ChildItem -LiteralPath 'release' -Filter 'ASTRA-PDF-Redesigner-Setup-*-x64.exe' -File)
            if ($secondSetups.Count -eq 1) {
              $secondSignatureStatus = (Get-AuthenticodeSignature -LiteralPath $secondSetups[0].FullName).Status
              $secondHash = (Get-FileHash -LiteralPath $secondSetups[0].FullName -Algorithm SHA256).Hash
              $secondBytes = (Get-Item -LiteralPath $secondSetups[0].FullName).Length
              $secondCandidatePath = Join-Path $env:RUNNER_TEMP 'astra-c010-second-unsigned-candidate.exe'
              Copy-Item -LiteralPath $secondSetups[0].FullName -Destination $secondCandidatePath
              Write-Output "C010 independent-tree installer: hash=$secondHash bytes=$secondBytes signature=$secondSignatureStatus"
              Remove-Item -LiteralPath $secondSetups[0].FullName -Force
            }
          }


          $thirdElevatePath = Join-Path $thirdAppPath 'resources/elevate.exe'
          $thirdElevateBeforeHash = (Get-FileHash -LiteralPath $thirdElevatePath -Algorithm SHA256).Hash
          $thirdElevateBeforeSignature = (Get-AuthenticodeSignature -LiteralPath $thirdElevatePath).Status
          npx electron-builder --win nsis --x64 --prepackaged $thirdAppPath --publish never
          $repeatExitCode = $LASTEXITCODE
          $reproStatus = 'FAIL'
          $reproDetail = "repeat canonical prepackaged NSIS build command exited $repeatExitCode"
          $repeatSetups = @()
          if ($repeatExitCode -eq 0) {
            $thirdElevateAfterHash = (Get-FileHash -LiteralPath $thirdElevatePath -Algorithm SHA256).Hash
            $thirdElevateAfterSignature = (Get-AuthenticodeSignature -LiteralPath $thirdElevatePath).Status
            Write-Output "C010 elevate same-tree repeat: before=$thirdElevateBeforeHash/$thirdElevateBeforeSignature after=$thirdElevateAfterHash/$thirdElevateAfterSignature"
            $repeatSetups = @(Get-ChildItem -LiteralPath 'release' -Filter 'ASTRA-PDF-Redesigner-Setup-*-x64.exe' -File)
            if ($repeatSetups.Count -eq 1) {
              $repeatSignature = Get-AuthenticodeSignature -LiteralPath $repeatSetups[0].FullName
              $repeatHash = (Get-FileHash -LiteralPath $repeatSetups[0].FullName -Algorithm SHA256).Hash
              $repeatBytes = (Get-Item -LiteralPath $repeatSetups[0].FullName).Length
              $reproStatus = if ($repeatHash -eq $firstCandidateHash -and $firstAsarHash -eq $secondAsarHash -and
                $firstSignature.Status -eq 'NotSigned' -and $repeatSignature.Status -eq 'NotSigned') { 'PASS' } else { 'FAIL' }
              $reproDetail = "sameTreeInstaller1=$firstCandidateHash sameTreeInstaller2=$repeatHash bytes1=$firstCandidateBytes bytes2=$repeatBytes independentTreeInstaller=$secondHash independentBytes=$secondBytes app.asar1=$firstAsarHash app.asar2=$secondAsarHash installerSignatures=$($firstSignature.Status)/$($repeatSignature.Status) independentSignature=$secondSignatureStatus"
            } else {
              $reproDetail = "repeat canonical build left $($repeatSetups.Count) candidate installers"
            }
          }
          Write-Output "C010 reproducibility $reproStatus $reproDetail"
          if (Test-Path -LiteralPath $env:GITHUB_STEP_SUMMARY) {
            "Canonical package tree and same-tree unsigned NSIS package reproducibility: $reproStatus ($reproDetail)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          if ($secondBuildExitCode -eq 0 -and $secondSetups.Count -eq 1) {
            node tests/c010-binary-diff-summary.cjs $firstCandidatePath $secondCandidatePath
            if ($LASTEXITCODE -ne 0) { throw 'Independent-tree binary diagnostic failed.' }
          }
          if ($repeatExitCode -eq 0 -and $repeatSetups.Count -eq 1) {
            node tests/c010-binary-diff-summary.cjs $firstCandidatePath $repeatSetups[0].FullName
            if ($LASTEXITCODE -ne 0) { throw 'Same-tree binary diagnostic failed.' }
          }
          if ($reproStatus -ne 'PASS') { throw 'Unsigned same-source Windows candidate is not bit-for-bit reproducible.' }
