name: C009 accessibility and 30-layout PDF print regression
on:
  push:
    branches: ['codex/astra-final-ai-sku-20261115']
    paths:
      - '.github/workflows/c009-accessibility.yml'
      - 'src/**'
      - 'tests/c009-accessibility-browser.mjs'
      - 'tests/c009-layout-print-browser.mjs'
      - 'tests/c009-resource-recovery-browser.mjs'
      - 'tests/browser-process.mjs'
      - 'index.html'
      - 'package*.json'
  pull_request:
    branches: ['integration/astra-final-blueprint-100-20261115']
    paths:
      - '.github/workflows/c009-accessibility.yml'
      - 'src/**'
      - 'tests/c009-accessibility-browser.mjs'
      - 'tests/c009-layout-print-browser.mjs'
      - 'tests/c009-resource-recovery-browser.mjs'
      - 'tests/browser-process.mjs'
      - 'index.html'
      - 'package*.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-accessibility:
    name: Chrome/Edge accessibility, layout, resource and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Existing regression and production build
        run: |
          npm test
          npm run build
      - name: Install Korean fonts and Poppler PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk poppler-utils
          fc-cache -f
      - name: Verify named controls, keyboard focus, and 30-layout print in Chrome and Edge
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          EDGE_BIN=$(command -v microsoft-edge || command -v microsoft-edge-stable || command -v microsoft-edge-beta || true)
          if [ -z "$CHROME_BIN" ] || [ -z "$EDGE_BIN" ]; then
            echo "::error::Both Chrome and Edge are required for C009 accessibility acceptance"
            exit 1
          fi
          npm run dev -- --port 4173 >/tmp/astra-c009-a11y.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then break; fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:4173 >/dev/null
          CHROME_PATH="$CHROME_BIN" node tests/c009-accessibility-browser.mjs
          C009_OUTPUT_DIR="$RUNNER_TEMP/astra-c009-layouts/chrome" CHROME_PATH="$CHROME_BIN" node tests/c009-layout-print-browser.mjs
          C009_RESOURCE_OUTPUT_DIR="$RUNNER_TEMP/astra-c009-resource/chrome" CHROME_PATH="$CHROME_BIN" node tests/c009-resource-recovery-browser.mjs
          CHROME_PATH="$EDGE_BIN" node tests/c009-accessibility-browser.mjs
          C009_OUTPUT_DIR="$RUNNER_TEMP/astra-c009-layouts/edge" CHROME_PATH="$EDGE_BIN" node tests/c009-layout-print-browser.mjs
          C009_RESOURCE_OUTPUT_DIR="$RUNNER_TEMP/astra-c009-resource/edge" CHROME_PATH="$EDGE_BIN" node tests/c009-resource-recovery-browser.mjs
      - name: Upload synthetic 30-layout print evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c009-accessibility-print-resource-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/astra-c009-layouts/
            ${{ runner.temp }}/astra-c009-resource/
          if-no-files-found: ignore
          retention-days: 14
