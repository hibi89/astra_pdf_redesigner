name: C010 unsigned Windows package candidate audit
on:
  push:
    branches: ['codex/astra-final-ai-sku-20261115']
    paths:
      - '.github/workflows/c010-package-audit.yml'
      - 'desktop/**'
      - 'electron-builder.yml'
      - 'src/**'
      - 'package*.json'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned-package-audit:
    name: Windows NSIS candidate, SBOM, and release-hold audit
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked application dependencies
        run: npm install --no-audit --no-fund
      - name: Run full regression and release-hold verification
        shell: pwsh
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'npm test failed.' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'npm run build failed.' }
          npm run desktop:verify
          if ($LASTEXITCODE -ne 0) { throw 'npm run desktop:verify failed.' }
      - name: Produce local-only SBOM and report license metadata coverage
        shell: pwsh
        run: |
          $sbomPath = Join-Path $env:RUNNER_TEMP 'astra-c010-sbom.json'
          npm sbom --sbom-format cyclonedx --omit=dev | Out-File -LiteralPath $sbomPath -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'npm SBOM generation failed.' }
          $summary = node -e "const fs=require('node:fs'); const s=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); const c=s.components||[]; const missing=c.filter(x=>!Array.isArray(x.licenses)||x.licenses.length===0); console.log(JSON.stringify({format:s.bomFormat,components:c.length,licenseMetadataMissing:missing.length}));" $sbomPath
          if ($LASTEXITCODE -ne 0) { throw 'SBOM JSON validation failed.' }
          "SBOM $summary" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Write-Output $summary
      - name: Build unsigned NSIS candidate without publishing
        shell: pwsh
        run: |
          npx electron-builder --win dir --x64 --publish never
          if ($LASTEXITCODE -ne 0) { throw 'Unpacked Windows application build failed.' }
          $asarPath = Join-Path $env:GITHUB_WORKSPACE 'release/win-unpacked/resources/app.asar'
          $asarCli = Join-Path $env:GITHUB_WORKSPACE 'node_modules/.bin/asar.cmd'
          if (-not (Test-Path -LiteralPath $asarPath -PathType Leaf)) { throw 'Built app.asar is missing.' }
          if (-not (Test-Path -LiteralPath $asarCli -PathType Leaf)) { throw 'Electron ASAR listing tool is missing.' }
          $asarEntries = @(& $asarCli list $asarPath)
          if ($LASTEXITCODE -ne 0) { throw 'Could not enumerate built app.asar.' }
          $testOnlyEntries = @($asarEntries | Where-Object { $_ -match '(?i)p124-electron-qwen3-acceptance|tests[/\\]fixtures[/\\]p124-electron-qwen3' })
          if ($testOnlyEntries.Count -ne 0) { throw "Test-only P124 content leaked into app.asar: $($testOnlyEntries -join ', ')" }
          Write-Output "PASS app.asar excludes P124 test harness; enumerated entries=$($asarEntries.Count)"
          $extractPath = Join-Path $env:RUNNER_TEMP 'astra-c010-app-asar-content'
          if (Test-Path -LiteralPath $extractPath) { throw 'Package audit extraction path already exists.' }
          & $asarCli extract $asarPath $extractPath
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract the unsigned app.asar into the isolated runner temp directory.' }
          node tests/c010-package-content-audit.cjs $extractPath
          if ($LASTEXITCODE -ne 0) { throw 'Unsigned app.asar content audit found a blocked path, secret signature, PII pattern, or unscanned item.' }
          $workspacePath = [System.IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $workspacePrefix = $workspacePath.TrimEnd([System.IO.Path]::DirectorySeparatorChar, [System.IO.Path]::AltDirectorySeparatorChar) + [System.IO.Path]::DirectorySeparatorChar
          $appDir = [System.IO.Path]::GetFullPath((Join-Path $workspacePath 'release/win-unpacked'))
          if (-not $appDir.StartsWith($workspacePrefix, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw 'Refusing to clear a generated app directory outside the GitHub workspace.'
          }
          if (-not (Test-Path -LiteralPath $appDir -PathType Container)) { throw 'First unpacked application directory is missing.' }

          function Normalize-AstraPackageTree([string]$root) {
            $resolved = [System.IO.Path]::GetFullPath($root)
            if (-not (Test-Path -LiteralPath $resolved -PathType Container)) { throw "Package tree is missing: $resolved" }
            $fixedUtc = [System.DateTime]::new(2020, 1, 1, 0, 0, 0, [System.DateTimeKind]::Utc)
            $items = @(Get-ChildItem -LiteralPath $resolved -Force -Recurse | Sort-Object { $_.FullName.Length } -Descending)
            foreach ($item in $items) {
              $item.CreationTimeUtc = $fixedUtc
              $item.LastWriteTimeUtc = $fixedUtc
              $item.LastAccessTimeUtc = $fixedUtc
            }
            $rootItem = Get-Item -LiteralPath $resolved -Force
            $rootItem.CreationTimeUtc = $fixedUtc
            $rootItem.LastWriteTimeUtc = $fixedUtc
            $rootItem.LastAccessTimeUtc = $fixedUtc
          }

          function Copy-AstraPackageTreeDeterministic([string]$source, [string]$destination) {
            $sourcePath = [System.IO.Path]::GetFullPath($source)
            $destinationPath = [System.IO.Path]::GetFullPath($destination)
            if (-not (Test-Path -LiteralPath $sourcePath -PathType Container)) { throw "Package source is missing: $sourcePath" }
            if (Test-Path -LiteralPath $destinationPath) { throw "Deterministic package destination already exists: $destinationPath" }
            New-Item -ItemType Directory -Path $destinationPath | Out-Null
            $items = @(Get-ChildItem -LiteralPath $sourcePath -Force -Recurse)
            if (@($items | Where-Object { $_.Attributes -band [System.IO.FileAttributes]::ReparsePoint }).Count -ne 0) {
              throw 'Deterministic staging does not accept reparse points.'
            }
            $directories = @($items | Where-Object { $_.PSIsContainer } | Sort-Object { $_.FullName.Substring($sourcePath.Length) } -CaseSensitive)
            foreach ($item in $directories) {
              $relative = $item.FullName.Substring($sourcePath.Length).TrimStart([char[]]@([System.IO.Path]::DirectorySeparatorChar, [System.IO.Path]::AltDirectorySeparatorChar))
              New-Item -ItemType Directory -Path (Join-Path $destinationPath $relative) -Force | Out-Null
            }
            $files = @($items | Where-Object { -not $_.PSIsContainer } | Sort-Object { $_.FullName.Substring($sourcePath.Length) } -CaseSensitive)
            foreach ($item in $files) {
              $relative = $item.FullName.Substring($sourcePath.Length).TrimStart([char[]]@([System.IO.Path]::DirectorySeparatorChar, [System.IO.Path]::AltDirectorySeparatorChar))
              Copy-Item -LiteralPath $item.FullName -Destination (Join-Path $destinationPath $relative)
            }
          }

          $firstAppPath = Join-Path $env:RUNNER_TEMP 'astra-c010-prepackaged-first'
          $secondAppPath = Join-Path $env:RUNNER_TEMP 'astra-c010-prepackaged-second'
          if ((Test-Path -LiteralPath $firstAppPath) -or (Test-Path -LiteralPath $secondAppPath)) {
            throw 'C010 prepackaged output path already exists.'
          }
          Copy-Item -LiteralPath $appDir -Destination $firstAppPath -Recurse
          Normalize-AstraPackageTree $firstAppPath
          $treeSnapshot = Join-Path $env:RUNNER_TEMP 'astra-c010-prepackaged-first.json'
          node tests/c010-package-tree-summary.cjs capture $firstAppPath $treeSnapshot
          if ($LASTEXITCODE -ne 0) { throw 'Could not capture first normalized package tree.' }

          Remove-Item -LiteralPath $appDir -Recurse -Force
          npx electron-builder --win dir --x64 --publish never
          if ($LASTEXITCODE -ne 0) { throw 'Second unpacked Windows application build failed.' }
          if (-not (Test-Path -LiteralPath $appDir -PathType Container)) { throw 'Second unpacked application directory is missing.' }
          Copy-Item -LiteralPath $appDir -Destination $secondAppPath -Recurse
          Normalize-AstraPackageTree $secondAppPath

          $treeComparisonOutput = node tests/c010-package-tree-summary.cjs compare $secondAppPath $treeSnapshot
          if ($LASTEXITCODE -ne 0) { throw 'Could not compare independent package trees.' }
          $treeComparison = $treeComparisonOutput | ConvertFrom-Json
          Write-Output $treeComparisonOutput
          if (-not $treeComparison.samePayloadTree -or $treeComparison.counts.metadataChangedEntries -ne 0) {
            throw 'Independent source builds did not produce matching canonical package trees.'
          }

          $firstAsarPath = Join-Path $firstAppPath 'resources/app.asar'
          $secondAsarPath = Join-Path $secondAppPath 'resources/app.asar'
          $firstAsarHash = (Get-FileHash -LiteralPath $firstAsarPath -Algorithm SHA256).Hash
          $secondAsarHash = (Get-FileHash -LiteralPath $secondAsarPath -Algorithm SHA256).Hash
          if ($firstAsarHash -ne $secondAsarHash) { throw 'Independent source build app.asar hashes differ.' }

          $packageStagePath = Join-Path $workspacePath '.c010-package-stage'
          $packageStageFullPath = [System.IO.Path]::GetFullPath($packageStagePath)
          if (-not $packageStageFullPath.StartsWith($workspacePrefix, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw 'Refusing to create a deterministic package stage outside the GitHub workspace.'
          }
          if (Test-Path -LiteralPath $packageStageFullPath) { throw 'C010 deterministic package stage already exists.' }

          $auditHelperPath = Join-Path $workspacePath 'tests/c010-nsis-intermediate-audit.cjs'
          if (-not (Test-Path -LiteralPath $auditHelperPath -PathType Leaf)) { throw 'NSIS intermediate audit helper is missing.' }
          $auditIncludePath = Join-Path $workspacePath '.c010-nsis-audit.nsh'
          $auditBuilderConfigPath = Join-Path $workspacePath '.c010-electron-builder.yml'
          $auditHelperForNsis = $auditHelperPath.Replace('\', '/')
          if ($auditHelperForNsis.Contains("'")) { throw 'The NSIS helper path cannot contain a single quote.' }
          $nsisSystemLine = "  !system 'node.exe `"$auditHelperForNsis`" `"`${APP_64}`" `"`${UNINSTALLER_OUT_FILE}`"' = 0"
          $nsisIncludeLines = @(
            '!macro customHeader',
            '!ifndef BUILD_UNINSTALLER',
            $nsisSystemLine,
            '!endif',
            '!macroend'
          )
          $nsisInclude = ($nsisIncludeLines -join "`r`n") + "`r`n"
          [System.IO.File]::WriteAllText($auditIncludePath, $nsisInclude, [System.Text.UTF8Encoding]::new($false))

          $builderConfig = Get-Content -LiteralPath (Join-Path $workspacePath 'electron-builder.yml') -Raw
          if ($builderConfig -notmatch '(?m)^nsis:') { throw 'Could not locate the nsis config block for the audit include.' }
          $auditIncludeForYaml = $auditIncludePath.Replace('\', '/')
          if ($auditIncludeForYaml.Contains("'")) { throw 'The NSIS include path cannot contain a single quote.' }
          $builderConfig = [System.Text.RegularExpressions.Regex]::Replace(
            $builderConfig,
            '(?m)^nsis:',
            "nsis:`r`n  include: '$auditIncludeForYaml'",
            1
          )
          [System.IO.File]::WriteAllText($auditBuilderConfigPath, $builderConfig, [System.Text.UTF8Encoding]::new($false))

          $appArchiveHash1 = (Get-FileHash -LiteralPath (Join-Path $firstAppPath 'resources/app.asar') -Algorithm SHA256).Hash
          $appArchiveHash2 = (Get-FileHash -LiteralPath (Join-Path $secondAppPath 'resources/app.asar') -Algorithm SHA256).Hash
          if ($appArchiveHash1 -ne $appArchiveHash2) { throw 'Independent source builds produced different app.asar files.' }

          Copy-AstraPackageTreeDeterministic $firstAppPath $packageStagePath
          Normalize-AstraPackageTree $packageStagePath
          $firstStageOutput = node tests/c010-package-tree-summary.cjs compare $packageStagePath $treeSnapshot
          if ($LASTEXITCODE -ne 0) { throw 'Could not validate the first deterministic stage.' }
          $firstStage = $firstStageOutput | ConvertFrom-Json
          Write-Output $firstStageOutput
          if (-not $firstStage.samePayloadTree -or $firstStage.counts.metadataChangedEntries -ne 0) {
            throw 'The first deterministic package stage differs from the canonical source tree.'
          }

          $env:ASTRA_C010_AUDIT_LABEL = 'first'
          npx electron-builder --config $auditBuilderConfigPath --win nsis --x64 --prepackaged $packageStagePath --publish never
          $firstBuildExitCode = $LASTEXITCODE
          Remove-Item Env:ASTRA_C010_AUDIT_LABEL -ErrorAction SilentlyContinue
          if ($firstBuildExitCode -ne 0) { throw "First prepackaged NSIS build failed with exit code $firstBuildExitCode." }
          $setups = @(Get-ChildItem -LiteralPath 'release' -Filter 'ASTRA-PDF-Redesigner-Setup-*-x64.exe' -File)
          if ($setups.Count -ne 1) { throw "Expected one first unsigned candidate, found $($setups.Count)." }
          $firstSignature = Get-AuthenticodeSignature -LiteralPath $setups[0].FullName
          if ($firstSignature.Status -ne 'NotSigned') { throw "Expected an unsigned first candidate, got $($firstSignature.Status)." }
          $firstCandidatePath = Join-Path $env:RUNNER_TEMP 'astra-c010-first-unsigned-candidate.exe'
          Copy-Item -LiteralPath $setups[0].FullName -Destination $firstCandidatePath
          $firstCandidateHash = (Get-FileHash -LiteralPath $firstCandidatePath -Algorithm SHA256).Hash
          $firstCandidateBytes = (Get-Item -LiteralPath $firstCandidatePath).Length
          Write-Output "C010 reproducibility build 1: installer=$firstCandidateHash app.asar=$appArchiveHash1"
          $firstIntermediateReportPath = Join-Path $env:RUNNER_TEMP 'astra-c010-nsis-intermediates/first/summary.json'
          if (-not (Test-Path -LiteralPath $firstIntermediateReportPath -PathType Leaf)) { throw 'First NSIS intermediate report was not captured.' }
          $firstIntermediateReport = Get-Content -LiteralPath $firstIntermediateReportPath -Raw | ConvertFrom-Json
          Write-Output ($firstIntermediateReport | ConvertTo-Json -Compress)
          $firstStageAfterOutput = node tests/c010-package-tree-summary.cjs compare $packageStagePath $treeSnapshot
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify the first staged tree after NSIS packaging.' }
          $firstStageAfter = $firstStageAfterOutput | ConvertFrom-Json
          Write-Output $firstStageAfterOutput
          $firstStageMutationPaths = @($firstStageAfter.sampleDifferences | ForEach-Object { $_.path })
          $firstExpectedNsisStageMutation = ($firstStageAfter.counts.added -eq 1 -and
            $firstStageAfter.counts.removed -eq 0 -and $firstStageAfter.counts.kindChanged -eq 0 -and
            $firstStageAfter.counts.contentChangedFiles -eq 0 -and
            $firstStageAfter.counts.metadataChangedEntries -eq 1 -and
            ($firstStageMutationPaths -join ',') -eq 'resources,resources/elevate.exe')
          $firstGeneratedElevatePath = Join-Path $packageStagePath 'resources/elevate.exe'
          if (-not (Test-Path -LiteralPath $firstGeneratedElevatePath -PathType Leaf)) { throw 'NSIS did not leave the expected first generated elevate.exe in the stage.' }
          $firstGeneratedElevateHash = (Get-FileHash -LiteralPath $firstGeneratedElevatePath -Algorithm SHA256).Hash
          Remove-Item -LiteralPath $setups[0].FullName -Force

          if (-not $packageStageFullPath.StartsWith($workspacePrefix, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw 'Refusing to replace a package stage outside the GitHub workspace.'
          }
          Remove-Item -LiteralPath $packageStageFullPath -Recurse -Force
          Copy-AstraPackageTreeDeterministic $secondAppPath $packageStagePath
          Normalize-AstraPackageTree $packageStagePath
          $secondStageOutput = node tests/c010-package-tree-summary.cjs compare $packageStagePath $treeSnapshot
          if ($LASTEXITCODE -ne 0) { throw 'Could not validate the second deterministic stage.' }
          $secondStage = $secondStageOutput | ConvertFrom-Json
          Write-Output $secondStageOutput
          if (-not $secondStage.samePayloadTree -or $secondStage.counts.metadataChangedEntries -ne 0) {
            throw 'The second deterministic package stage differs from the canonical source tree.'
          }

          $env:ASTRA_C010_AUDIT_LABEL = 'second'
          npx electron-builder --config $auditBuilderConfigPath --win nsis --x64 --prepackaged $packageStagePath --publish never
          $secondBuildExitCode = $LASTEXITCODE
          Remove-Item Env:ASTRA_C010_AUDIT_LABEL -ErrorAction SilentlyContinue
          if ($secondBuildExitCode -ne 0) { throw "Second prepackaged NSIS build failed with exit code $secondBuildExitCode." }
          $secondStageAfterOutput = node tests/c010-package-tree-summary.cjs compare $packageStagePath $treeSnapshot
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify the second staged tree after NSIS packaging.' }
          $secondStageAfter = $secondStageAfterOutput | ConvertFrom-Json
          Write-Output $secondStageAfterOutput
          $secondStageMutationPaths = @($secondStageAfter.sampleDifferences | ForEach-Object { $_.path })
          $secondExpectedNsisStageMutation = ($secondStageAfter.counts.added -eq 1 -and
            $secondStageAfter.counts.removed -eq 0 -and $secondStageAfter.counts.kindChanged -eq 0 -and
            $secondStageAfter.counts.contentChangedFiles -eq 0 -and
            $secondStageAfter.counts.metadataChangedEntries -eq 1 -and
            ($secondStageMutationPaths -join ',') -eq 'resources,resources/elevate.exe')
          $secondGeneratedElevatePath = Join-Path $packageStagePath 'resources/elevate.exe'
          if (-not (Test-Path -LiteralPath $secondGeneratedElevatePath -PathType Leaf)) { throw 'NSIS did not leave the expected second generated elevate.exe in the stage.' }
          $secondGeneratedElevateHash = (Get-FileHash -LiteralPath $secondGeneratedElevatePath -Algorithm SHA256).Hash

          $secondSetups = @(Get-ChildItem -LiteralPath 'release' -Filter 'ASTRA-PDF-Redesigner-Setup-*-x64.exe' -File)
          if ($secondSetups.Count -ne 1) { throw "Expected one second unsigned candidate, found $($secondSetups.Count)." }
          $secondSignature = Get-AuthenticodeSignature -LiteralPath $secondSetups[0].FullName
          if ($secondSignature.Status -ne 'NotSigned') { throw "Expected an unsigned second candidate, got $($secondSignature.Status)." }
          $secondCandidatePath = Join-Path $env:RUNNER_TEMP 'astra-c010-second-unsigned-candidate.exe'
          Copy-Item -LiteralPath $secondSetups[0].FullName -Destination $secondCandidatePath
          $secondHash = (Get-FileHash -LiteralPath $secondCandidatePath -Algorithm SHA256).Hash
          $secondBytes = (Get-Item -LiteralPath $secondCandidatePath).Length
          $secondIntermediateReportPath = Join-Path $env:RUNNER_TEMP 'astra-c010-nsis-intermediates/second/summary.json'
          if (-not (Test-Path -LiteralPath $secondIntermediateReportPath -PathType Leaf)) { throw 'Second NSIS intermediate report was not captured.' }
          $secondIntermediateReport = Get-Content -LiteralPath $secondIntermediateReportPath -Raw | ConvertFrom-Json
          Write-Output ($secondIntermediateReport | ConvertTo-Json -Compress)

          $intermediateArchiveSame = $firstIntermediateReport.appArchive.sha256 -eq $secondIntermediateReport.appArchive.sha256
          $intermediateUninstallerSame = $firstIntermediateReport.uninstaller.sha256 -eq $secondIntermediateReport.uninstaller.sha256
          Write-Output "C010 intermediate compare: appArchiveSame=$intermediateArchiveSame appArchiveMtime1=$($firstIntermediateReport.appArchive.lastWriteTimeUtc) appArchiveMtime2=$($secondIntermediateReport.appArchive.lastWriteTimeUtc) uninstallerSame=$intermediateUninstallerSame uninstallerMtime1=$($firstIntermediateReport.uninstaller.lastWriteTimeUtc) uninstallerMtime2=$($secondIntermediateReport.uninstaller.lastWriteTimeUtc)"
          $firstUninstallerPath = Join-Path (Split-Path -Parent $firstIntermediateReportPath) $firstIntermediateReport.uninstaller.copy
          $secondUninstallerPath = Join-Path (Split-Path -Parent $secondIntermediateReportPath) $secondIntermediateReport.uninstaller.copy
          $uninstallerDiffOutput = node tests/c010-binary-diff-summary.cjs $firstUninstallerPath $secondUninstallerPath
          if ($LASTEXITCODE -ne 0) { throw 'Could not compare generated NSIS uninstaller binaries.' }
          $uninstallerDiff = $uninstallerDiffOutput | ConvertFrom-Json
          Write-Output "C010 generated uninstaller binary diff $uninstallerDiffOutput"
          $generatedElevateSame = $firstGeneratedElevateHash -eq $secondGeneratedElevateHash
          Write-Output "C010 NSIS generated elevate.exe compare: first=$firstGeneratedElevateHash second=$secondGeneratedElevateHash same=$generatedElevateSame"

          $reproStatus = if ($firstBuildExitCode -eq 0 -and $secondBuildExitCode -eq 0 -and
            $setups.Count -eq 1 -and $secondSetups.Count -eq 1 -and
            $firstStage.samePayloadTree -and $firstStage.counts.metadataChangedEntries -eq 0 -and
            $secondStage.samePayloadTree -and $secondStage.counts.metadataChangedEntries -eq 0 -and
            $firstExpectedNsisStageMutation -and $secondExpectedNsisStageMutation -and $generatedElevateSame -and
            $firstCandidateHash -eq $secondHash -and $firstCandidateBytes -eq $secondBytes -and
            $appArchiveHash1 -eq $appArchiveHash2 -and
            $firstSignature.Status -eq 'NotSigned' -and $secondSignature.Status -eq 'NotSigned') { 'PASS' } else { 'FAIL' }
          $reproDetail = "installer1=$firstCandidateHash installer2=$secondHash bytes1=$firstCandidateBytes bytes2=$secondBytes app.asar1=$appArchiveHash1 app.asar2=$appArchiveHash2 intermediateArchiveSame=$intermediateArchiveSame intermediateUninstallerSame=$intermediateUninstallerSame uninstallerDiffBytes=$($uninstallerDiff.differingByteCount) uninstallerDiffRanges=$($uninstallerDiff.differingRangeCount) uninstallerPeTimestampEqual=$($uninstallerDiff.peTimestamp.equal) generatedElevateSame=$generatedElevateSame expectedStageMutations=$firstExpectedNsisStageMutation/$secondExpectedNsisStageMutation installerSignatures=$($firstSignature.Status)/$($secondSignature.Status)"
          Write-Output "C010 reproducibility $reproStatus $reproDetail"
          if (Test-Path -LiteralPath $env:GITHUB_STEP_SUMMARY) {
            "Two independent Windows app trees, staged at one stable path, with production NSIS behavior and unsigned package reproducibility: $reproStatus ($reproDetail)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          node tests/c010-binary-diff-summary.cjs $firstCandidatePath $secondCandidatePath
          if ($LASTEXITCODE -ne 0) { throw 'C010 package binary diagnostic failed.' }
          if ($reproStatus -ne 'PASS') { throw 'Unsigned same-source Windows candidate is not bit-for-bit reproducible.' }